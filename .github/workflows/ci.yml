name: ci

# Runs the gate (scripts/verify.sh) on every pull request to main and on main itself.
# Every action is pinned to a full commit SHA (ADR-019). Merging needs the `verify (full gate)`
# check green plus Hashir's approval (Q-001, docs/ops/github-settings.md).
#
# ADR-043, ADR-056: the full gate runs as four parallel jobs (static checks; unit, integration and
# contract tests; the Playwright ui project; build, stack and e2e) that together run every
# verify.sh step. A PR's lane comes from its changed paths (scripts/lib/change-lane.mjs):
#   docs  only docs/**, *.md or docs/backlog.json: the docs fast path
#   ui    only apps/ui/**: static checks, unit tests and the ui project (verify.sh --ui)
#   full  anything else, and every push to main, so nothing a lane skipped can hide there
# Every lane ends in the one required check name, `verify (full gate)`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Free private repos get 2,000 Actions minutes a month: on a pull request a newer push cancels the
# older run. On main every merge's full gate runs to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "lane=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a file moved from code into docs/ lists its old path too, so it is not docs-only.
          lane="$(git diff --no-renames --name-only "$BASE...$HEAD" | node scripts/lib/change-lane.mjs)"
          echo "lane: $lane"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

  docs:
    name: docs (fast path)
    needs: changes
    if: needs.changes.outputs.lane == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Docs gate
        run: bash scripts/verify.sh --docs

  static:
    name: static checks
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Static checks, secrets and dependency audit
        run: bash scripts/verify.sh --only=install,lint,typecheck,openapi,depcruise,names,coverage,limits,squawk,actionlint,caddy,gitleaks,audit

  tests:
    name: unit, integration and contract tests
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit, integration and contract tests
        run: bash scripts/verify.sh --only=install,unit,integration,contract

  ui:
    # The Playwright ui project needs no stack, so it runs beside the stack job. On the ui lane
    # this job is the whole gate (verify.sh --ui).
    name: ui tests
    needs: changes
    if: needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history on the ui lane
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Locate the Playwright version
        id: paths
        run: echo "playwright=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.paths.outputs.playwright }}

      - name: UI lane (static checks, unit tests, ui project)
        if: needs.changes.outputs.lane == 'ui'
        run: bash scripts/verify.sh --ui

      - name: Playwright ui project
        if: needs.changes.outputs.lane == 'full'
        run: bash scripts/verify.sh --only=install,ui-e2e

      - name: Upload Playwright report and step logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-evidence
          path: |
            playwright-report/
            .verify-logs/
          retention-days: 7
          if-no-files-found: ignore

  stack:
    name: build, stack and e2e
    needs: changes
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OB_BUILD_CACHE_DIR: /tmp/ob-buildx-cache
      OB_IMAGE_CACHE_DIR: /tmp/ob-images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Locate the Playwright version
        id: paths
        run: echo "playwright=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.paths.outputs.playwright }}

      # Docker image layers: a BuildKit builder exports its cache to a directory that this cache
      # keeps. Keyed on what changes the expensive layers (dependencies and Dockerfiles), so a
      # normal push reuses the entry instead of storing a new one and evicting other caches.
      - name: Cache Docker image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ob-buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'infra/docker/**') }}
          restore-keys: buildx-${{ runner.os }}-

      # Built images, keyed by a hash of their inputs (T-0208): an unchanged image is loaded, not
      # rebuilt. The entry key covers all five keys, so a run that changes no image saves nothing.
      - name: Image input keys
        id: images
        run: echo "key=$(node scripts/lib/image-key.mjs web worker pii-vault site provider-mocks | sha256sum | cut -c1-24)" >> "$GITHUB_OUTPUT"

      - name: Cache built images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ob-images
          key: images-${{ runner.os }}-${{ steps.images.outputs.key }}
          restore-keys: images-${{ runner.os }}-

      - name: BuildKit builder
        run: docker buildx create --name ob --driver docker-container --use

      - name: Build, stack and e2e
        run: bash scripts/verify.sh --only=install,build,stack,e2e

      - name: Upload Playwright report and stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            playwright-report/
            .verify/e2e-*.txt
            .verify-logs/
          retention-days: 7
          if-no-files-found: ignore

  verify:
    # The one required check: green only when every job this change needs has passed.
    name: verify (full gate)
    # Every gate job is listed (ADR-079); tests/config/ci.test.ts fails if one is left out.
    needs: [changes, docs, static, tests, ui, stack, semgrep]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LANE: ${{ needs.changes.outputs.lane }}
          DOCS: ${{ needs.docs.result }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          UI: ${{ needs.ui.result }}
          STACK: ${{ needs.stack.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "changes=$CHANGES lane=$LANE docs=$DOCS static=$STATIC tests=$TESTS ui=$UI stack=$STACK semgrep=$SEMGREP"
          [[ "$CHANGES" == success ]] || exit 1
          # Semgrep runs on pull requests only: a pull request needs it green, a push may skip it.
          if [[ "$EVENT" == pull_request ]]; then
            [[ "$SEMGREP" == success ]] || exit 1
          else
            [[ "$SEMGREP" == success || "$SEMGREP" == skipped ]] || exit 1
          fi
          case "$LANE" in
            full) [[ "$STATIC" == success && "$TESTS" == success && "$UI" == success && "$STACK" == success ]] ;;
            ui) [[ "$UI" == success ]] ;;
            docs) [[ "$DOCS" == success ]] ;;
            *) exit 1 ;;
          esac

  semgrep:
    name: semgrep (code scan)
    # Pull requests only, to save Actions minutes; main only ever changes through a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep CE
        run: semgrep scan --config p/default --error --metrics=off --exclude docs --exclude pnpm-lock.yaml
