name: ci

# Runs the gate (scripts/verify.sh) on every pull request to main and on main itself.
# Every action is pinned to a full commit SHA (ADR-019). Merging needs the `verify (full gate)`
# check green plus Hashir's approval (Q-001, docs/ops/github-settings.md).
#
# ADR-043: the full gate runs as three parallel jobs (static checks; unit, integration and
# contract tests; build, stack and e2e) that together run every verify.sh step. A PR that changes
# only docs/**, *.md or docs/backlog.json takes the docs fast path instead. Either way the final
# job keeps the one required check name, `verify (full gate)`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Free private repos get 2,000 Actions minutes a month: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only="$(git diff --name-only "$BASE...$HEAD" | node scripts/lib/docs-only.mjs)"
          if [[ "$docs_only" == true ]]; then code=false; else code=true; fi
          echo "docs only: $docs_only"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    name: docs (fast path)
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Docs gate
        run: bash scripts/verify.sh --docs

  static:
    name: static checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Static checks, secrets and dependency audit
        run: bash scripts/verify.sh --only=install,lint,typecheck,openapi,depcruise,names,coverage,limits,squawk,actionlint,caddy,gitleaks,audit

  tests:
    name: unit, integration and contract tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit, integration and contract tests
        run: bash scripts/verify.sh --only=install,unit,integration,contract

  stack:
    name: build, stack and e2e
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OB_BUILD_CACHE_DIR: /tmp/ob-buildx-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Locate the Playwright version
        id: paths
        run: echo "playwright=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.paths.outputs.playwright }}

      # Docker image layers: a BuildKit builder that can export its cache to a directory, which
      # this cache keeps between runs (the newest layers replace the older ones).
      - name: Cache Docker image layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ob-buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildx-${{ runner.os }}-

      - name: BuildKit builder
        run: docker buildx create --name ob --driver docker-container --use

      - name: Build, stack and e2e
        run: bash scripts/verify.sh --only=install,build,stack,e2e

      - name: Upload Playwright report and stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            playwright-report/
            .verify/e2e-*.txt
          retention-days: 7
          if-no-files-found: ignore

  verify:
    # The one required check: green only when every job this change needs has passed.
    name: verify (full gate)
    needs: [changes, docs, static, tests, stack]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
          STACK: ${{ needs.stack.result }}
        run: |
          echo "changes=$CHANGES code=$CODE docs=$DOCS static=$STATIC tests=$TESTS stack=$STACK"
          [[ "$CHANGES" == success ]] || exit 1
          if [[ "$CODE" == true ]]; then
            [[ "$STATIC" == success && "$TESTS" == success && "$STACK" == success ]]
          else
            [[ "$DOCS" == success ]]
          fi

  semgrep:
    name: semgrep (code scan)
    # Pull requests only, to save Actions minutes; main only ever changes through a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep CE
        run: semgrep scan --config p/default --error --metrics=off --exclude docs --exclude pnpm-lock.yaml
