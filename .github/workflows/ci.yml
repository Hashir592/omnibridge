name: ci

# Runs the full gate (scripts/verify.sh) on every pull request to main and on main itself.
# Every action is pinned to a full commit SHA (ADR-019). Merging needs this green plus
# Hashir's approval (Q-001, docs/ops/github-settings.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Free private repos get 2,000 Actions minutes a month: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: verify (full gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable && corepack install

      - name: Locate caches
        id: paths
        run: |
          echo "pnpm-store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.paths.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.paths.outputs.playwright }}

      - name: Full gate
        run: bash scripts/verify.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  semgrep:
    name: semgrep (code scan)
    # Pull requests only, to save Actions minutes; main only ever changes through a PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep CE
        run: semgrep scan --config p/default --error --metrics=off --exclude docs --exclude pnpm-lock.yaml
