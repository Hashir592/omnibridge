packages:
  - apps/*
  - packages/*
  - packages/governors/*
  - packages/providers/*
  - mocks/*

# Dependency build scripts are denied unless listed as true (pnpm 12 fails on unlisted ones).
allowBuilds:
  cpu-features: false # optional native speed-up for ssh2 (Testcontainers); not needed
  lefthook: false # hooks are installed by the root "prepare" script instead
  protobufjs: false # postinstall only prints a version check
  ssh2: false # optional native crypto add-on; pure-JS fallback is used

# Supply-chain hardening (Semgrep pnpm rules, SEC-4):
blockExoticSubdeps: true # sub-dependencies may come only from the registry, never git/tarball URLs
minimumReleaseAge: 10080 # minutes (7 days)
trustPolicy: no-downgrade # refuse an update whose publish provenance is weaker than before
