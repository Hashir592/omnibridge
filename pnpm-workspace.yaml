packages:
  - apps/*
  - packages/*
  - packages/governors/*
  - packages/providers/*
  - mocks/*

# Dependency build scripts are denied unless listed as true (pnpm 12 fails on unlisted ones).
allowBuilds:
  cpu-features: false # optional native speed-up for ssh2 (Testcontainers); not needed
  lefthook: false # hooks are installed by the root "prepare" script instead
  protobufjs: false # postinstall only prints a version check
  ssh2: false # optional native crypto add-on; pure-JS fallback is used

# Supply-chain hardening (Semgrep pnpm rules, SEC-4):
blockExoticSubdeps: true # sub-dependencies may come only from the registry, never git/tarball URLs
minimumReleaseAge: 10080 # minutes (7 days)
trustPolicy: no-downgrade # refuse an update whose publish provenance is weaker than before
# Exact versions S1 vetted in the ADR table on 18 Oct 2026 that are still under 7 days old,
# plus their sub-dependencies of the same age (75 entries). Exact versions only: any newer
# version still waits 7 days. Delete this list after 25 Oct 2026 (PS-005).
minimumReleaseAgeExclude:
  - '@astrojs/compiler-binding-android-arm64@0.5.2'
  - '@astrojs/compiler-binding-darwin-arm64@0.5.2'
  - '@astrojs/compiler-binding-darwin-x64@0.5.2'
  - '@astrojs/compiler-binding-linux-arm64-gnu@0.5.2'
  - '@astrojs/compiler-binding-linux-arm64-musl@0.5.2'
  - '@astrojs/compiler-binding-linux-x64-gnu@0.5.2'
  - '@astrojs/compiler-binding-linux-x64-musl@0.5.2'
  - '@astrojs/compiler-binding-wasm32-wasi@0.5.2'
  - '@astrojs/compiler-binding-win32-arm64-msvc@0.5.2'
  - '@astrojs/compiler-binding-win32-x64-msvc@0.5.2'
  - '@astrojs/compiler-binding@0.5.2'
