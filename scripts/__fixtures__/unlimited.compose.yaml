# Fixture for the [OPS-10] check-limits test: every service here breaks one rule.
name: check-limits-fixture
services:
  unlimited:
    image: busybox
    healthcheck:
      test: [CMD, 'true']
  no-health:
    image: busybox
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 16
    networks: [ob_app]
  foreign-net:
    image: busybox
    mem_limit: 32m
    cpus: 0.1
    pids_limit: 16
