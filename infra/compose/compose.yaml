# OmniBridge core stack (ARCHITECTURE.md §7, OPS-8, OPS-10).
# Every service has mem_limit, cpus, pids_limit and a healthcheck (checked by scripts/check-limits.sh).
# Limits are the "today" column of the production budget; local containers keep them (ADR-029).
# Dev-only services (edge proxy, mail catcher, provider mocks, clamd stand-in) are in compose.dev.yaml.
name: omnibridge

x-app-hardening: &app-hardening
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

x-job-hardening: &job-hardening
  restart: 'no'
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  labels:
    com.omnibridge.kind: job # one-off: exits when done, so it has no healthcheck

x-db-main-env: &db-main-env
  DB_MAIN_HOST: db-main
  DB_MAIN_PORT: '5432'
  DB_MAIN_NAME: omnibridge

x-db-pii-env: &db-pii-env
  DB_PII_HOST: db-pii
  DB_PII_PORT: '5432'
  DB_PII_NAME: omnibridge_pii

services:
  db-main:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: omnibridge
      POSTGRES_PASSWORD_FILE: /run/secrets/db_main_superuser_password
    # PostgreSQL settings: ARCHITECTURE.md §7 "db-main today".
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=96MB
      - -c
      - max_connections=45
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=1GB
    secrets:
      - db_main_superuser_password
      - ob_owner_password
      - ob_app_password
      - ob_worker_password
      - ob_ops_password
      - ob_platform_password
    volumes:
      - db_main_data:/var/lib/postgresql
      - ./db-main/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [ob_db]
    shm_size: 128m
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d omnibridge]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  db-pii:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: omnibridge_pii
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pii_superuser_password
    # PostgreSQL settings: ARCHITECTURE.md §7 "db-pii". No WAL archiving (invariant 8).
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=160MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=15
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=1GB
    secrets:
      - db_pii_superuser_password
      - vault_owner_password
      - vault_app_password
    volumes:
      - db_pii_data:/var/lib/postgresql
      - ./db-pii/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [ob_pii]
    shm_size: 64m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d omnibridge_pii]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  migrate-main:
    <<: *job-hardening
    image: omnibridge/web:dev
    # Same build as web, so a clean clone never tries to pull this local-only image.
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: web }
    command: [node, node_modules/@omnibridge/db/dist/migrate-cli.js]
    environment:
      <<: *db-main-env
      DB_MAIN_USER: ob_owner
      DB_MAIN_PASSWORD_FILE: /run/secrets/ob_owner_password
    secrets: [ob_owner_password]
    networks: [ob_db]
    depends_on:
      db-main: { condition: service_healthy }
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64

  migrate-pii:
    <<: *job-hardening
    image: omnibridge/pii-vault:dev
    # Same build as pii-vault, so a clean clone never tries to pull this local-only image.
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: pii-vault }
    command: [node, node_modules/@omnibridge/pii-db/dist/migrate-cli.js]
    environment:
      <<: *db-pii-env
      DB_PII_USER: vault_owner
      DB_PII_PASSWORD_FILE: /run/secrets/vault_owner_password
    secrets: [vault_owner_password]
    networks: [ob_pii]
    depends_on:
      db-pii: { condition: service_healthy }
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64

  web:
    <<: *app-hardening
    image: omnibridge/web:dev
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: web }
    environment:
      <<: *db-main-env
      DB_MAIN_USER: ob_app
      DB_MAIN_PASSWORD_FILE: /run/secrets/ob_app_password
      SECRETS_KEK_FILE: /run/secrets/secrets_kek
      FILE_LINK_HMAC_KEY_FILE: /run/secrets/file_link_hmac_key
      # Keys the sign-in lockout counters and the recovery codes (T-0203, ADR-048, ADR-050).
      AUTH_HMAC_KEY_FILE: /run/secrets/auth_hmac_key
      # The only origins allowed on state-changing requests (SEC-1). Dev default: the dev edge;
      # production sets the app's own origin (M22).
      APP_ORIGINS: ${APP_ORIGINS:-https://localhost:8443}
      # WWW-7: the legal version users must accept; the date on the site's legal pages.
      TERMS_VERSION: ${TERMS_VERSION:-2026-11-15}
      # Believe X-Forwarded-For only from private-network peers: web sits on Docker's private
      # networks behind the edge, and Caddy replaces any client-sent X-Forwarded-For. So the
      # sign-in delay and the audit see the client's address, not the edge's (ADR-008).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-uniquelocal}
      FILES_DIR: /data/files
      PII_VAULT_URL: http://pii-vault:8080
      # Web's vault token: ingest, read-full (order detail, inbox), mask, search, match (T-0402).
      VAULT_TOKEN_FILE: /run/secrets/vault_token_web
      PORT: '8080'
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      NODE_OPTIONS: --max-old-space-size=288
    secrets: [ob_app_password, secrets_kek, file_link_hmac_key, auth_hmac_key, vault_token_web]
    # Encrypted files (T-0105, ADR-012): the only writable path in the read-only container.
    volumes:
      - files_data:/data/files
    networks:
      ob_edge:
        aliases: [omnibridge-web]
      ob_app: {}
      ob_db: {}
    depends_on:
      migrate-main: { condition: service_completed_successfully }
      pii-vault: { condition: service_healthy }
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [CMD, node, dist/healthcheck.js]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *app-hardening
    image: omnibridge/worker:dev
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: worker }
    environment:
      <<: *db-main-env
      # ob_worker: the tenant grants, the reset-link definer and the audit purge (ADR-049, ADR-051).
      DB_MAIN_USER: ob_worker
      DB_MAIN_PASSWORD_FILE: /run/secrets/ob_worker_password
      # The scheduled fan-out lists workspace ids as ob_platform, nothing else (T-0202).
      DB_PLATFORM_USER: ob_platform
      DB_PLATFORM_PASSWORD_FILE: /run/secrets/ob_platform_password
      SECRETS_KEK_FILE: /run/secrets/secrets_kek
      WORKER_HEALTH_FILE: /tmp/worker-heartbeat
      # Most jobs at once across all queues; /metrics on an unpublished port (T-0104).
      FILES_DIR: /data/files
      # pii-vault over ob_app (T-0402): the worker token for ingest, labels and the inbox; the
      # deletion token only for the deletion jobs (DEL-1).
      PII_VAULT_URL: http://pii-vault:8080
      VAULT_TOKEN_FILE: /run/secrets/vault_token_worker
      VAULT_DELETION_TOKEN_FILE: /run/secrets/vault_token_deletion
      CLAMD_HOST: clamd
      CLAMD_PORT: '3310'
      # Auth mail (T-0203): links point at the app's origin. Dev defaults send to Mailpit in plain
      # SMTP on the internal network; production sets Scaleway TEM with TLS (M22, ADR-020).
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_ALLOW_PLAIN: ${SMTP_ALLOW_PLAIN:-1}
      WORKER_CONCURRENCY: '8'
      METRICS_PORT: '9464'
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      NODE_OPTIONS: --max-old-space-size=384
    secrets:
      [
        ob_worker_password,
        ob_platform_password,
        secrets_kek,
        vault_token_worker,
        vault_token_deletion,
      ]
    # The worker only reads files (to scan them); it never writes the volume.
    volumes:
      - files_data:/data/files:ro
    networks: [ob_app, ob_db, scan_ob]
    depends_on:
      migrate-main: { condition: service_completed_successfully }
      pii-vault: { condition: service_healthy }
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [CMD, node, dist/healthcheck.js]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # KEK rotation for every workspace (SEC-6, runbook "Rotate a master key"). One-off and opt-in:
  #   docker compose -f infra/compose/compose.yaml --profile ops run --rm rewrap-keys
  # The only container with ob_platform (to list the workspaces), ob_ops, the secrets KEK and a
  # writable files volume, so web itself never holds ob_platform (T-0201). The worker holds
  # ob_platform too, for the scheduled fan-out, but mounts the files volume read-only (T-0202).
  rewrap-keys:
    <<: *job-hardening
    image: omnibridge/web:dev
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: web }
    profiles: [ops]
    command: [node, dist/rewrap-keys.js]
    environment:
      <<: *db-main-env
      # ob_ops: the tenant grants and the platform-key definers, never sessions (ADR-051).
      DB_MAIN_USER: ob_ops
      DB_MAIN_PASSWORD_FILE: /run/secrets/ob_ops_password
      DB_PLATFORM_USER: ob_platform
      DB_PLATFORM_PASSWORD_FILE: /run/secrets/ob_platform_password
      SECRETS_KEK_FILE: /run/secrets/secrets_kek
      FILES_DIR: /data/files
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    secrets: [ob_ops_password, ob_platform_password, secrets_kek]
    volumes:
      - files_data:/data/files
    networks: [ob_db]
    depends_on:
      migrate-main: { condition: service_completed_successfully }
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64

  pii-vault:
    <<: *app-hardening
    image: omnibridge/pii-vault:dev
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: pii-vault }
    environment:
      <<: *db-pii-env
      DB_PII_USER: vault_app
      DB_PII_PASSWORD_FILE: /run/secrets/vault_app_password
      PII_KEK_FILE: /run/secrets/pii_kek
      # One token per caller (invariant 8); the vault holds all three to tell callers apart.
      VAULT_TOKEN_WEB_FILE: /run/secrets/vault_token_web
      VAULT_TOKEN_WORKER_FILE: /run/secrets/vault_token_worker
      VAULT_TOKEN_DELETION_FILE: /run/secrets/vault_token_deletion
      # The off-site tombstone journal (invariant 10): IDs only; a local volume stands in for B2
      # until the backup job ships it (T-0405).
      DELETION_JOURNAL_DIR: /data/journal
      PORT: '8080'
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      NODE_OPTIONS: --max-old-space-size=64
    secrets:
      [vault_app_password, pii_kek, vault_token_web, vault_token_worker, vault_token_deletion]
    volumes:
      - pii_journal:/data/journal
    networks: [ob_app, ob_pii]
    depends_on:
      migrate-pii: { condition: service_completed_successfully }
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, node, dist/healthcheck.js]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  site:
    <<: *app-hardening
    image: omnibridge/site:dev
    build:
      context: ../..
      dockerfile: infra/docker/site.Dockerfile
    networks:
      ob_edge:
        aliases: [omnibridge-site]
    mem_limit: 24m
    cpus: 0.1
    pids_limit: 32
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

# Networks carry explicit names so the shared edge project can join ob_edge (P-004).
networks:
  ob_edge:
    name: ob_edge
  ob_app:
    name: ob_app
  ob_db:
    name: ob_db
    internal: true # ADR-034: PostgreSQL needs no internet egress
  ob_pii:
    name: ob_pii
    internal: true
  scan_ob:
    name: scan_ob
    internal: true

volumes:
  db_main_data:
  db_pii_data:
  files_data:
  pii_journal:

# Dev secret files are materialised by scripts/dev-secrets.sh from infra/secrets/dev.sops.yaml
# (git-ignored, synthetic). Containers read them only as /run/secrets/<name> files (SEC-5). The two
# master keys: secrets_kek only in web, worker and the rewrap-keys ops job, pii_kek only in
# pii-vault (ADR-007, ADR-014).
# Register: docs/ops/secrets-register.md. Production secrets arrive in M22.
secrets:
  db_main_superuser_password:
    file: ./.secrets/db_main_superuser_password
  ob_owner_password:
    file: ./.secrets/ob_owner_password
  ob_app_password:
    file: ./.secrets/ob_app_password
  ob_worker_password:
    file: ./.secrets/ob_worker_password
  ob_ops_password:
    file: ./.secrets/ob_ops_password
  auth_hmac_key:
    file: ./.secrets/auth_hmac_key
  ob_platform_password:
    file: ./.secrets/ob_platform_password
  db_pii_superuser_password:
    file: ./.secrets/db_pii_superuser_password
  vault_owner_password:
    file: ./.secrets/vault_owner_password
  vault_app_password:
    file: ./.secrets/vault_app_password
  secrets_kek:
    file: ./.secrets/secrets_kek
  pii_kek:
    file: ./.secrets/pii_kek
  vault_token_web:
    file: ./.secrets/vault_token_web
  vault_token_worker:
    file: ./.secrets/vault_token_worker
  vault_token_deletion:
    file: ./.secrets/vault_token_deletion
  file_link_hmac_key:
    file: ./.secrets/file_link_hmac_key
