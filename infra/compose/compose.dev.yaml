# Dev-only services, layered on compose.yaml:
#   docker compose -f infra/compose/compose.yaml -f infra/compose/compose.dev.yaml up -d --wait
# clamd sits under the "scan" profile so everyday `up` does not hold 1.4 GB; add --profile scan.
services:
  # Local stand-in for the shared edge Caddy (P-004): HTTPS on localhost with Caddy's local CA.
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - 127.0.0.1:8443:8443
      - 127.0.0.1:8444:8444
    volumes:
      - ./dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ob_edge]
    depends_on:
      web: { condition: service_healthy }
      site: { condition: service_healthy }
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Catches all outbound mail in dev (ADR-020). UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    ports:
      - 127.0.0.1:8025:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
      MP_MAX_MESSAGES: '500'
    networks: [ob_app]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # DEV ONLY seed (T-0203, ADR-050): the launch workspace and the DEV ONLY demo sign-in, once,
  # after migrations. It refuses to run unless OB_ENV is dev or test. Web waits for it, so the
  # demo sign-in works as soon as the stack is up.
  seed:
    image: omnibridge/web:dev
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: web }
    command: [node, dist/seed-dev.js]
    restart: 'no'
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      com.omnibridge.kind: job # one-off: exits when done, so it has no healthcheck
    environment:
      OB_ENV: dev
      DB_MAIN_HOST: db-main
      DB_MAIN_PORT: '5432'
      DB_MAIN_NAME: omnibridge
      DB_MAIN_USER: ob_ops
      DB_MAIN_PASSWORD_FILE: /run/secrets/ob_ops_password
      SECRETS_KEK_FILE: /run/secrets/secrets_kek
      AUTH_HMAC_KEY_FILE: /run/secrets/auth_hmac_key
    secrets: [ob_ops_password, secrets_kek, auth_hmac_key]
    networks: [ob_db]
    depends_on:
      migrate-main: { condition: service_completed_successfully }
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64

  web:
    depends_on:
      seed: { condition: service_completed_successfully }
    environment:
      # PLAT-1, dev: loopback only. Docker Desktop hands host traffic to the edge from the
      # ob_edge gateway, and the edge's ports are bound to 127.0.0.1, so that one address is this
      # machine. The dev ob_edge subnet is pinned below (ADR-073), so the gateway is 10.203.0.1 on
      # every machine. Never a Docker gateway in production: there it is the VPN range (ADR-076).
      PLATFORM_IP_ALLOWLIST: ${PLATFORM_IP_ALLOWLIST:-127.0.0.1/32,::1/128,10.203.0.1/32}

  # The only provider endpoints dev and CI may call (ADR-011, invariant 17).
  provider-mocks:
    image: omnibridge/provider-mocks:dev
    build:
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args: { APP: provider-mocks }
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PORT: '8080'
      NODE_OPTIONS: --max-old-space-size=96
    networks: [ob_app]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, node, dist/healthcheck.js]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Dev stand-in for the single shared clamd owned by the edge host layer (ADR-021).
  # The image ships a signature database; freshclam is off so dev makes no update calls.
  clamd:
    profiles: [scan]
    image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: 'true'
      CLAMAV_NO_MILTERD: 'true'
    networks: [scan_ob]
    mem_limit: 1400m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

# Dev only (ADR-073): a fixed ob_edge subnet, so the console allowlist above names its gateway
# on any machine. 10.203.0.0/24 is outside Docker's default pools. Changing it needs one
# `docker compose down` (no -v) and `up -d`: Docker never re-addresses an existing network.
networks:
  ob_edge:
    ipam:
      config:
        - subnet: 10.203.0.0/24
          gateway: 10.203.0.1

volumes:
  caddy_data:
  caddy_config:
